[package]
name = "vorrat"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
description = "Private, self-hosted emergency supply planner and household stock tracker"
repository = "https://github.com/Emalsha/vorrat"
readme = "README.md"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["form", "json", "query", "multipart"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
flate2 = "1"
tar = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "time"] }
tower-http = { version = "0.6", features = ["set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
askama = "0.14"
getrandom = "0.2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
# Small enough for a Raspberry Pi: opt-level "s" makes the binary about a
# quarter smaller (9.6 -> 7.3 MB) for about 3% fewer requests per second.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
