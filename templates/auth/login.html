{% extends "base.html" %}
{% block title %}{{ "Sign in"|t }} · Vorrat{% endblock %}
{% block heading %}Vorrat{% endblock %}
{% block content %}
  <form method="post" action="/login" class="card pad stack mt">
    <input type="hidden" name="next" value="{{ next }}">
    <label>{{ "Household password"|t }} <input type="password" name="password" required autofocus autocomplete="current-password"></label>
    <button class="btn primary block">{{ "Sign in"|t }}</button>
  </form>
{% endblock %}
